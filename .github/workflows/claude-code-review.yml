name: Claude Code Review

# PR に「@claude review」とコメントしたときだけ、Claude がレビューして日本語でコメントする。
# コードの変更・コミットはしない（使えるツールはコメント投稿だけ）。
on:
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # PR へのコメントで、先頭が「@claude review」、書いたのがリポジトリの関係者のときだけ動く
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '@claude review') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      # issue_comment ではデフォルトブランチがチェックアウトされる。
      # REVIEW.md と CLAUDE.md はベースブランチのものを使うので、これでよい
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.issue.number }}'
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "レビューのコメントと要約は、すべて日本語で書く。コード、識別子、コマンドは原文のまま書く。リポジトリに REVIEW.md があれば、その重大度の定義と観点に従う。"
