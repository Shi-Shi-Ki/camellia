# 検証用（マージしない）: 修正版の claude-review.yml を pull_request から呼ぶ
name: test-review
on:
  pull_request:
jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    uses: Shi-Shi-Ki/cosmos/.github/workflows/claude-review.yml@fix/claude-review
    with:
      pr-number: ${{ github.event.pull_request.number }}
    secrets: inherit
