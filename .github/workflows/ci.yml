name: CI

# PR ごとに、機械で確実に見つかる問題を検出する。
# Claude のレビューより先にここで落とし、レビューは設計や判断に集中させる。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript（型チェック・lint・format・テスト）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        if: hashFiles('pnpm-lock.yaml') != ''
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: hashFiles('pnpm-lock.yaml') != ''
        with:
          node-version: 24
          cache: pnpm

      - name: 依存を入れる（lockfile どおりにだけ入れる）
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile

      - name: 型チェック
        if: hashFiles('tsconfig.json') != ''
        run: pnpm exec tsc --noEmit

      # package.json の lint は --fix 付きでファイルを書き換えるため、CI では検出だけを行う
      - name: Lint
        if: hashFiles('eslint.config.mjs') != ''
        run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"

      - name: Format
        if: hashFiles('.prettierrc') != ''
        run: pnpm exec prettier --check "src/**/*.ts" "test/**/*.ts"

      # e2e（test:e2e）は Redis / LocalStack が必要なため、ここでは単体テストだけを実行する
      - name: 単体テスト
        if: hashFiles('package.json') != ''
        run: pnpm test --ci

  terraform:
    name: Terraform（fmt・validate）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        if: hashFiles('terraform/**/*.tf') != ''
        with:
          terraform_version: "~1.9"

      - name: fmt
        if: hashFiles('terraform/**/*.tf') != ''
        run: terraform fmt -check -recursive

      # backend とクラウドには接続しない（認証情報は使わない）
      - name: validate
        if: hashFiles('terraform/**/*.tf') != ''
        run: |
          terraform init -backend=false -input=false
          terraform validate

  secrets:
    name: 秘密情報の検出
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # state や変数ファイルには、平文の秘密情報や構成情報が入るため、コミットさせない
      - name: tfstate / tfvars / .env がコミットされていないか
        run: |
          found=$(git ls-files '*.tfstate' '*.tfstate.*' '*.tfvars' '.env' '.env.*' | grep -v '^\.env\.example$' || true)
          if [ -n "$found" ]; then
            echo "::error::コミットしてはいけないファイルがあります: $found"
            exit 1
          fi

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
